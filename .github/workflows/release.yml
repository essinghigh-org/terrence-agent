name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Package Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.0
          target: x86_64-unknown-linux-musl
          components: rustfmt, clippy
          cache-shared-key: terrence-agent-release

      - name: Build release binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          export CC_x86_64_unknown_linux_musl=musl-gcc
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "v${version}" = "${RELEASE_TAG}" || {
            echo "tag ${RELEASE_TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          cargo build --locked --release --target x86_64-unknown-linux-musl
          ./bin/build-landlock-runner.sh

          artifact="terrence-agent-${RELEASE_TAG}-linux-amd64"
          mkdir -p "dist/${artifact}"
          cp target/x86_64-unknown-linux-musl/release/terrence-agent bin/landlock-runner "dist/${artifact}/"
          tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
          rm -rf "dist/${artifact}"

      - name: Generate source SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: .
          artifact-name: terrence-agent-${{ github.ref_name }}.sbom.spdx.json
          output-file: dist/terrence-agent-${{ github.ref_name }}.sbom.spdx.json

      - name: Write release metadata and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          rustc_version="$(rustc --version)"
          cat > dist/release-metadata.json <<EOF
          {
            "name": "terrence-agent",
            "version": "${RELEASE_TAG#v}",
            "tag": "${RELEASE_TAG}",
            "commit": "${RELEASE_SHA}",
            "target": "x86_64-unknown-linux-musl",
            "rustc": "${rustc_version}"
          }
          EOF
          (cd dist && sha256sum *.tar.gz *.json > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.json
            dist/SHA256SUMS
