name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Keep CI on current stable: the locked wiremock dev dependency uses
          # let-chain syntax newer than the package's minimum Rust version.
          toolchain: stable
          components: rustfmt, clippy
          cache-shared-key: terrence-agent

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  landlock-runner:
    name: Landlock runner (hardened C build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc libc6-dev linux-libc-dev

      - name: Build and probe runner
        run: ./bin/build-landlock-runner.sh

      - name: Verify static PIE hardening
        run: |
          file bin/landlock-runner
          readelf -h bin/landlock-runner | grep -Eq 'Type:[[:space:]]+DYN'
          readelf -l bin/landlock-runner | grep -q GNU_RELRO
          bin/landlock-runner --version

  docker:
    name: Docker image build and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: terrence-agent:ci
          build-args: |
            TERRENCE_VERSION=ci
            VCS_REF=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Generate image SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: terrence-agent:ci
          artifact-name: terrence-agent-sbom.spdx.json
          output-file: terrence-agent-sbom.spdx.json

      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terrence-agent-sbom
          path: terrence-agent-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
