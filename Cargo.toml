[package]
name = "terrence-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A sandboxed Terraform/OpenTofu execution agent for Terrence"
license = "Apache-2.0"
repository = "https://github.com/essinghigh-org/terrence-agent"
readme = "README.md"
keywords = ["terraform", "opentofu", "agent", "landlock"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
flate2 = "1"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[bin]]
name = "terrence-agent"
path = "src/main.rs"
